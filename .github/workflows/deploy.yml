name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, and never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm

      # Runs against the dist/ the step above just built. Exits 1 if any asset in a must-use
      # folder stopped being referenced. The usual cause is a page deleted without its images.
      # The artifact is already uploaded at this point, but `deploy` needs this job to pass,
      # so a failure here still stops the deploy.
      - name: Check every asset is still referenced
        run: npm run assets

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
