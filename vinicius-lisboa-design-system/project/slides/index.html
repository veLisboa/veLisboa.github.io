<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Speaking deck — Vinicius Lisboa</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--paper-sunken)}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel" src="Slides.jsx"></script>
<script type="text/babel">
const { Button } = window.ViniciusLisboaDesignSystem_249f05;
const deck=[["Title",TitleSlide],["Divider",DividerSlide],["Content",ContentSlide],["Closing",ClosingSlide]];
function App(){
  const [i,setI]=React.useState(0);
  React.useEffect(()=>{const h=e=>{if(e.key==='ArrowRight')setI(v=>Math.min(v+1,deck.length-1));if(e.key==='ArrowLeft')setI(v=>Math.max(v-1,0));};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[]);
  const C=deck[i][1];
  return <div style={{padding:24}}>
    <div style={{display:'flex',gap:4,alignItems:'center',marginBottom:16,borderBottom:'2px solid var(--rule-strong)',paddingBottom:10}}>
      {deck.map(([l],n)=><Button key={l} size="sm" variant={n===i?'primary':'ghost'} onClick={()=>setI(n)}>{l}</Button>)}
      <span style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontSize:12,color:'var(--ink-secondary)'}}>← → to navigate · authored at 1920×1080</span>
    </div>
    <div style={{border:'1px solid var(--rule)',width:1280}}><Fit><C/></Fit></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
