<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--paper)}.l{font-family:var(--font-mono);font-size:11px;color:var(--ink-secondary);margin-top:8px}</style></head><body>
<div style="display:flex;gap:28px;align-items:flex-end">
<div><span style="font-family:var(--font-script);font-weight:400;font-size:68px;color:var(--ink);line-height:1">VL</span><div class="l">--font-script · Petit Formal Script 400</div></div>
<div style="display:flex;gap:16px;align-items:flex-end;border-left:1px solid var(--rule);padding-left:28px">
<span style="width:64px;height:64px;background:var(--ink);color:var(--paper);font-family:var(--font-script);font-weight:400;font-size:36px;display:flex;align-items:center;justify-content:center">VL</span>
<span style="width:44px;height:44px;border:1px solid var(--ink);color:var(--ink);font-family:var(--font-script);font-weight:400;font-size:25px;display:flex;align-items:center;justify-content:center">VL</span>
<span style="width:24px;height:24px;background:var(--ink);color:var(--paper);font-family:var(--font-script);font-weight:400;font-size:14px;display:flex;align-items:center;justify-content:center">VL</span></div>
<div style="border-left:1px solid var(--rule);padding-left:28px;font-family:var(--font-body);font-size:13px;line-height:1.55;color:var(--ink-secondary);max-width:20em">Reserved for the monogram. It is never a heading, a pull quote, a slide title or a signature line — the script is the mark, not a voice.</div>
</div></body></html>
