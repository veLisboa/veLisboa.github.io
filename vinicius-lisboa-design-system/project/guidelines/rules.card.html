<style>body{margin:0;padding:20px 24px;background:var(--paper)}.sw{height:64px}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-secondary);letter-spacing:.02em;margin-top:6px}.nm{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--ink)}</style></head><body><div style="display:grid;gap:22px;max-width:520px">
